<!DOCTYPE html>
<html>

<head lang="en">
    <title>Sensor Monitor Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <sdpi-item label="Sensor">
        <sdpi-select setting="sensorId" datasource="getSensors" placeholder="Select sensor" loading="Loading sensors...">
        </sdpi-select>
    </sdpi-item>

    <sdpi-item label="Show Label">
        <sdpi-checkbox setting="showLabel" default="true"></sdpi-checkbox>
    </sdpi-item>
</body>

</html>
